name: Generate Blog Post

on:
  # Every Monday at 08:00 IST (02:30 UTC). Scheduled starts can be delayed by GitHub.
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:
    inputs:
      topic_index:
        description: 'Topic index (blank selects the next unpublished topic)'
        required: false
        default: ''

# Serialize every workflow that writes blog content so scheduled generation and
# manual image regeneration cannot race each other on the default branch.
concurrency:
  group: blog-content-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate manual input
        env:
          TOPIC_INDEX: ${{ inputs.topic_index }}
        run: |
          if [[ -n "$TOPIC_INDEX" && ! "$TOPIC_INDEX" =~ ^[0-9]+$ ]]; then
            echo "topic_index must be a non-negative integer" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate post and topic-specific images
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://us.api.openai.com/v1
          TOPIC_INDEX: ${{ inputs.topic_index }}
        run: |
          if [[ -n "$TOPIC_INDEX" ]]; then
            npx tsx scripts/generate-post.ts --index "$TOPIC_INDEX"
          else
            npx tsx scripts/generate-post.ts
          fi

      - name: Preserve generated text when image generation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blog-generation-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/portfolio-blog-generation/*.mdx
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate generated content
        run: |
          git diff --check
          npm run typecheck
          npm run audit-blog
          if [[ -f .generated-slug ]]; then
            slug="$(tr -d '\r\n' < .generated-slug)"
            npm run audit-linkedin -- --slug "$slug"
          fi
          npm run build

      - name: Upload paste-ready LinkedIn draft
        if: steps.generate.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-draft-${{ steps.generate.outputs.slug }}
          path: content/linkedin-drafts/${{ steps.generate.outputs.slug }}.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated content and open a review pull request
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            content/posts \
            content/linkedin-drafts \
            public/images/blog \
            public/robots.txt \
            public/sitemap.xml \
            public/sitemap-0.xml
          if git diff --staged --quiet; then
            echo "No new post generated (the backlog may already be complete)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          review_branch="automation/blog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$review_branch"
          git commit -m "content: generate sourced blog post with OpenAI"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push --set-upstream origin "$review_branch"

          pr_url="$(gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$review_branch" \
            --title "Editorial review: generated Salesforce field note" \
            --body "Generated with the OpenAI Responses and Image APIs. Includes a paste-ready LinkedIn draft with explicit word and character budgets. Review every release-status claim, source, code sample, image, and first-person statement before merging. This pull request is intentionally not auto-merged.")"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Opened review pull request: $pr_url"
